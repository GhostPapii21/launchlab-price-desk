<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchLab Price Desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #0F1A17; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="desk" src="desk.html" title="LaunchLab"></iframe>
<script>
(function () {
  var frame = document.getElementById('desk');
  function inject() {
    var d = frame.contentDocument;
    if (!d || !d.body) return;
    if (d.getElementById('ll-import')) return;
    function add(src, id) {
      var s = d.createElement('script');
      s.id = id;
      s.src = src + '?t=' + Date.now();
      d.body.appendChild(s);
    }
    add('book-import.js', 'll-import');
    add('history-import.js', 'll-hist');
  }
  frame.addEventListener('load', inject);
})();
</script>
</body>
</html>
