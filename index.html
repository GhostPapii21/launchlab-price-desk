<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchLab Price Desk</title>
<meta name="description" content="MLB prop price desk: model probabilities vs. book lines, loaded from MLB stats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --card:#F8FAF6; --ink:#16233A; --muted:#5D6B66; --grid:#C9D2CB; --grid2:#DDE3DD;
  --red:#B3261E; --green:#1F6B45; --amber:#8A5A00; --field:#FFFFFF; --navtint:rgba(238,241,236,.94);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F1A17; --card:#15231F; --ink:#E6ECE7; --muted:#93A39B; --grid:#2C3D36; --grid2:#22322C;
  --red:#F07167; --green:#5CC98E; --amber:#E7B75F; --field:#0C1613; --navtint:rgba(15,26,23,.94);} }
:root[data-theme="dark"]{ --paper:#0F1A17; --card:#15231F; --ink:#E6ECE7; --muted:#93A39B; --grid:#2C3D36; --grid2:#22322C;
  --red:#F07167; --green:#5CC98E; --amber:#E7B75F; --field:#0C1613; --navtint:rgba(15,26,23,.94);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:2.3rem}
h2{font-size:1.55rem;margin:26px 0 10px}
h3{font-size:1.2rem}
p{margin:.4em 0}
.sub{color:var(--muted);font-size:.93rem}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px double var(--ink);padding-bottom:10px}
.mast .date{font-family:var(--cond);font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:8px 14px;font-weight:600}
button.primary{background:var(--ink);color:var(--paper)}
button.ghost{border-color:var(--grid)}
button.small{padding:4px 10px;font-size:.88rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
input,select,textarea{background:var(--field);border:1.5px solid var(--grid);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:120px;font-size:.88rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin:10px 0}
.row.tight{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}
.card{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:14px;margin:12px 0}
.note{border-left:3px solid var(--amber);padding:6px 10px;color:var(--muted);font-size:.9rem;margin:10px 0}
.warn{color:var(--amber);font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-family:var(--cond);font-weight:600;font-size:.95rem;text-align:right;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{padding:7px 6px;border-bottom:1px solid var(--grid2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tap{cursor:pointer} tr.tap:hover td{background:var(--grid2)}
.slot{font-family:var(--cond);font-weight:700;font-size:1.15rem;width:1.6em;display:inline-block}
.big{font-family:var(--cond);font-weight:700;font-size:1.05rem}
.odds{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.chip{display:inline-block;font-family:var(--cond);font-weight:700;font-size:1rem;padding:1px 8px;border-radius:4px;border:1.5px solid currentColor}
.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-top:8px}
.hero .p{font-family:var(--cond);font-weight:700;font-size:3.6rem;line-height:.9}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navtint);backdrop-filter:blur(8px);border-top:1.5px solid var(--grid);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;border-radius:0;padding:12px 2px 10px;font-family:var(--cond);font-size:1.02rem;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--paper);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.empty{padding:22px 4px;color:var(--muted)}
.pill{font-size:.8rem;border:1px solid var(--grid);border-radius:20px;padding:1px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;z-index:40;font-weight:600}
details summary{cursor:pointer;font-weight:600;margin:8px 0}
.seg{display:inline-flex;border:1.5px solid var(--grid);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:no-preference){ .sheet>div{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
</style>

<body>
<main id="app"><p class="empty">Loading…</p></main>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheet"></div>
<script>
// ===== LaunchLab model =====
const LG = { K: .222, BB: .085, HR: .031, S1: .142, S2: .044, S3: .004 }; // per-PA league rates
const REG_B = { K: 60, BB: 120, HR: 170, S1: 600, S2: 600, S3: 600 };      // batter regression PAs
const REG_P = { K: 70, BB: 170, HR: 600, S1: 700, S2: 700, S3: 700 };      // pitcher regression BF
const SLOT_PA = [4.65, 4.55, 4.45, 4.35, 4.25, 4.15, 4.05, 3.95, 3.85];
const RUNNER_ON = [0.85, 0.95, 1.1, 1.15, 1.1, 1.0, 0.95, 0.9, 0.85]; // RBI chances by slot
const SCORE_F = [1.15, 1.1, 1.05, 1.0, 0.95, 0.92, 0.9, 0.9, 0.95];   // run-scoring by slot

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const ipToNum = ip => { const n = num(ip); const w = Math.floor(n); const f = Math.round((n - w) * 10); return w + (f === 1 ? 1/3 : f === 2 ? 2/3 : 0); };

function battingCounts(b) {
  const s = b.season || {}; let c = { PA: num(s.PA), H: num(s.H), D: num(s.D), T: num(s.T), HR: num(s.HR), BB: num(s.BB), SO: num(s.SO) };
  if (!c.PA && b.log && b.log.length) b.log.forEach(g => { c.PA += num(g.PA); c.H += num(g.H); c.D += num(g.D); c.T += num(g.T); c.HR += num(g.HR); c.BB += num(g.BB); c.SO += num(g.SO); });
  return c;
}
function rates(c, n, reg, base) {
  const s1 = Math.max(0, c.H - c.D - c.T - c.HR);
  const r = x => (x.cnt + base[x.k] * reg[x.k]) / (n + reg[x.k]);
  return { K: r({ cnt: c.SO, k: 'K' }), BB: r({ cnt: c.BB, k: 'BB' }), HR: r({ cnt: c.HR, k: 'HR' }), S1: r({ cnt: s1, k: 'S1' }), S2: r({ cnt: c.D, k: 'S2' }), S3: r({ cnt: c.T, k: 'S3' }) };
}
function batterRates(b) { const c = battingCounts(b); return { r: rates(c, c.PA, REG_B, LG), n: c.PA }; }

function pitcherCounts(p, side) {
  const src = side && p.split && p.split[side] && num(p.split[side].BF) ? p.split[side] : (p.season || {});
  let c = { BF: num(src.BF), H: num(src.H), D: num(src.D), T: num(src.T), HR: num(src.HR), BB: num(src.BB), SO: num(src.SO) };
  if (!c.BF && !side && p.log && p.log.length) p.log.forEach(g => { c.BF += num(g.BF); c.H += num(g.H); c.HR += num(g.HR); c.BB += num(g.BB); c.SO += num(g.SO); });
  if (!c.D && c.H) { c.D = Math.round((c.H - c.HR) * 0.21); c.T = Math.round((c.H - c.HR) * 0.02); } // estimate XBH mix if missing
  return c;
}
function pitcherRates(p, side) {
  const overall = rates(pitcherCounts(p), num(pitcherCounts(p).BF), REG_P, LG);
  if (!side) return overall;
  const c = pitcherCounts(p, side);
  if (!p.split || !p.split[side] || !num(p.split[side].BF)) return overall;
  return rates(c, c.BF, { K: 150, BB: 250, HR: 700, S1: 700, S2: 700, S3: 700 }, overall); // split regressed to his overall
}

const oddsRatio = (b, p, l) => { const o = (b / (1 - b)) * (p / (1 - p)) / (l / (1 - l)); return o / (1 + o); };
function combine(br, pr, adj) {
  const out = {};
  for (const k of Object.keys(LG)) out[k] = oddsRatio(br[k], pr[k], LG[k]);
  out.S1 *= adj.hit; out.S2 *= adj.hit; out.S3 *= adj.hit; out.HR *= adj.hr; out.K *= adj.k || 1;
  const tot = out.K + out.BB + out.HR + out.S1 + out.S2 + out.S3;
  if (tot > 0.92) for (const k of Object.keys(out)) out[k] *= 0.92 / tot;
  out.OUT = 1 - (out.K + out.BB + out.HR + out.S1 + out.S2 + out.S3);
  return out;
}
function platoon(bHand, pHand) {
  if (!bHand || !pHand) return { hit: 1, hr: 1, k: 1 };
  const bh = bHand === 'S' ? (pHand === 'R' ? 'L' : 'R') : bHand;
  return bh === pHand ? { hit: 0.97, hr: 0.9, k: 1.06 } : { hit: 1.03, hr: 1.08, k: 0.95 };
}

// mulberry32 rng for repeatable sims
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function simBatter(ctx, N = 6000) {
  const { batter, pitcher, slot, home, parkHit = 1, parkHR = 1, wxHR = 1, pen = 4.1, teamRuns = 4.5, starterIP } = ctx;
  const s = Math.min(9, Math.max(1, slot | 0)) - 1;
  const side = batter.hand === 'S' ? (pitcher.hand === 'R' ? 'L' : 'R') : batter.hand;
  const br = batterRates(batter).r, pr = pitcherRates(pitcher, side === 'L' ? 'vsL' : side === 'R' ? 'vsR' : null);
  const pl = platoon(batter.hand, pitcher.hand);
  const baseAdj = { hit: parkHit * pl.hit, hr: parkHR * wxHR * pl.hr, k: pl.k };
  const vsSP = combine(br, pr, baseAdj);
  const penF = Math.sqrt(Math.max(2, Math.min(7, pen)) / 4.1);
  const vsPen = combine(br, LG, { hit: baseAdj.hit * penF, hr: baseAdj.hr * penF, k: pl.k / penF });
  const T = Math.max(0.4, teamRuns / 4.5);
  const ePA = SLOT_PA[s] * (home ? 0.97 : 1);
  const ip = starterIP != null && starterIP !== '' ? num(starterIP) : expectedIP(pitcher);
  const spBF = ip * 4.25; const ePAsp = Math.max(0, Math.min(ePA, (spBF - s) / 9 + (spBF > s ? 0 : 0)));
  const R = rng(1234 + s * 7 + Math.round(ip * 10));
  const keys = ['H', 'TB', 'HR', 'S1', 'S2', 'S3', 'BB', 'R', 'RBI', 'HRR', 'K'];
  const dist = {}; keys.forEach(k => dist[k] = new Array(9).fill(0));
  const draw = (P) => { let u = R(); for (const k of ['K', 'BB', 'HR', 'S1', 'S2', 'S3']) { if (u < P[k]) return k; u -= P[k]; } return 'OUT'; };
  const rf = RUNNER_ON[s] * T, sf = SCORE_F[s] * T * 0.9;
  for (let i = 0; i < N; i++) {
    const nPA = Math.floor(ePA) + (R() < ePA - Math.floor(ePA) ? 1 : 0);
    const nSP = Math.floor(ePAsp) + (R() < ePAsp - Math.floor(ePAsp) ? 1 : 0);
    const c = { H: 0, TB: 0, HR: 0, S1: 0, S2: 0, S3: 0, BB: 0, R: 0, RBI: 0, K: 0 };
    for (let pa = 0; pa < nPA; pa++) {
      const o = draw(pa < nSP ? vsSP : vsPen);
      if (o === 'HR') { c.H++; c.HR++; c.TB += 4; c.R++; c.RBI++; for (let r = 0; r < 3; r++) if (R() < 0.2 * rf) c.RBI++; }
      else if (o === 'S1') { c.H++; c.S1++; c.TB++; if (R() < Math.min(.9, .15 * rf)) c.RBI++; if (R() < Math.min(.9, .30 * sf)) c.R++; }
      else if (o === 'S2') { c.H++; c.S2++; c.TB += 2; if (R() < Math.min(.9, .30 * rf)) c.RBI++; if (R() < Math.min(.9, .45 * sf)) c.R++; }
      else if (o === 'S3') { c.H++; c.S3++; c.TB += 3; if (R() < Math.min(.9, .40 * rf)) c.RBI++; if (R() < Math.min(.95, .65 * sf)) c.R++; }
      else if (o === 'BB') { c.BB++; if (R() < Math.min(.9, .28 * sf)) c.R++; if (R() < .03 * rf) c.RBI++; }
      else if (o === 'K') c.K++;
      else if (R() < .02 * rf) c.RBI++;
    }
    c.HRR = c.H + c.R + c.RBI;
    for (const k of keys) dist[k][Math.min(8, c[k])]++;
  }
  for (const k of keys) dist[k] = dist[k].map(x => x / N);
  return { dist, ePA, ePAsp, vsSP, ip };
}

function expectedIP(p) {
  const s = p.season || {}; const gs = num(s.GS), ip = ipToNum(s.IP);
  if (gs && ip) return Math.max(3, Math.min(7.5, ip / gs));
  if (p.log && p.log.length) { const l = p.log.slice(-10); return Math.max(3, Math.min(7.5, l.reduce((a, g) => a + ipToNum(g.IP), 0) / l.length)); }
  return 5.2;
}
function pitcherERA9(p) {
  const s = p.season || {}; const ip = ipToNum(s.IP); const lgERA = 4.1;
  if (!ip) return lgERA;
  const era = num(s.ER) * 9 / ip;
  const fip = (13 * num(s.HR) + 3 * num(s.BB) - 2 * num(s.SO)) / ip + 3.15;
  const blend = 0.4 * era + 0.6 * fip;
  return (blend * ip + lgERA * 60) / (ip + 60); // regress toward league with 60 IP
}
function simPitcher(ctx, N = 6000) {
  const { pitcher, oppWRC = 100, parkHit = 1, parkHR = 1, starterIP } = ctx;
  const pr = pitcherRates(pitcher);
  const off = oppWRC / 100;
  const P = combine(LG, pr, { hit: parkHit * Math.pow(off, 0.6), hr: parkHR * Math.pow(off, 1.2), k: Math.pow(off, -0.5) });
  const ip = starterIP != null && starterIP !== '' ? num(starterIP) : expectedIP(pitcher);
  const bf = ip * 4.25; const er9 = pitcherERA9(pitcher) * Math.pow(off, 1.1) * Math.sqrt(parkHit * parkHR);
  const R = rng(99 + Math.round(ip * 100));
  const keys = ['PH', 'PER', 'PK', 'PBB', 'POUT'];
  const dist = { PH: new Array(16).fill(0), PER: new Array(12).fill(0), PK: new Array(16).fill(0), PBB: new Array(10).fill(0), POUT: new Array(28).fill(0) };
  const gauss = () => { let u = 0, v = 0; while (!u) u = R(); v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const pois = (m) => { let L = Math.exp(-m), k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; };
  const gamma = (a) => { let s = 0; for (let i = 0; i < a; i++) s -= Math.log(R()); return s; }; // integer shape
  for (let i = 0; i < N; i++) {
    const n = Math.max(6, Math.round(bf + gauss() * 4));
    let h = 0, k = 0, bb = 0, outs = 0;
    for (let j = 0; j < n; j++) { let u = R(); if (u < P.K) { k++; outs++; } else if ((u -= P.K) < P.BB) bb++; else if ((u -= P.BB) < P.HR + P.S1 + P.S2 + P.S3) h++; else outs++; }
    const m = er9 * (n / 4.25) / 9 * (1 + 0.08 * (h - n * (P.HR + P.S1 + P.S2 + P.S3)));
    const er = pois(Math.max(0.05, m) * gamma(3) / 3);
    dist.PH[Math.min(15, h)]++; dist.PER[Math.min(11, er)]++; dist.PK[Math.min(15, k)]++; dist.PBB[Math.min(9, bb)]++; dist.POUT[Math.min(27, outs)]++;
  }
  for (const k of keys) dist[k] = dist[k].map(x => x / N);
  return { dist, ip, er9, P, bf };
}
const pOver = (d, line) => d.reduce((a, x, i) => a + (i > line ? x : 0), 0);
const mean = d => d.reduce((a, x, i) => a + x * i, 0);

function amToProb(o) { o = num(o); if (!o) return null; return o > 0 ? 100 / (o + 100) : -o / (-o + 100); }
function probToAm(p) { if (p <= 0 || p >= 1) return '—'; return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : '+' + Math.round(100 * (1 - p) / p); }
function price(modelP, odds, oppOdds) {
  const imp = amToProb(odds); if (imp == null) return null;
  const opp = amToProb(oppOdds); const fair = opp != null ? imp / (imp + opp) : imp;
  const o = num(odds); const b = o > 0 ? o / 100 : 100 / -o;
  const ev = modelP * b - (1 - modelP);
  const kelly = Math.max(0, (b * modelP - (1 - modelP)) / b);
  return { imp, fair, edge: modelP - fair, ev, kelly: Math.min(0.03, kelly / 4) };
}

// ===== MLB loader (statsapi.mlb.com) =====
const API = 'https://statsapi.mlb.com/api/v1';
const PARKS = { 'Coors Field': [1.12, 1.15], 'Great American Ball Park': [1.0, 1.25], 'Yankee Stadium': [0.98, 1.15], 'Citizens Bank Park': [1.0, 1.12], 'Fenway Park': [1.06, 0.95], 'Dodger Stadium': [0.97, 1.12], 'Globe Life Field': [0.98, 1.02], 'Chase Field': [1.03, 0.95], 'Kauffman Stadium': [1.05, 0.85], 'Oracle Park': [0.98, 0.8], 'T-Mobile Park': [0.93, 0.92], 'Petco Park': [0.95, 0.95], 'loanDepot park': [0.97, 0.85], 'Comerica Park': [1.0, 0.88], 'Truist Park': [1.0, 1.03], 'American Family Field': [0.98, 1.1], 'Wrigley Field': [1.0, 1.02], 'Busch Stadium': [0.99, 0.87], 'PNC Park': [1.0, 0.85], 'Target Field': [1.01, 0.97], 'Progressive Field': [0.98, 0.92], 'Rate Field': [1.0, 1.08], 'Angel Stadium': [0.99, 1.05], 'Daikin Park': [0.99, 1.05], 'Minute Maid Park': [0.99, 1.05], 'Oriole Park at Camden Yards': [1.0, 0.95], 'Tropicana Field': [0.96, 0.92], 'George M. Steinbrenner Field': [1.02, 1.12], 'Rogers Centre': [1.0, 1.05], 'Nationals Park': [1.0, 1.0], 'Citi Field': [0.96, 0.98], 'Sutter Health Park': [1.03, 1.1] };
let LOAD = { busy: false, msg: '' };
async function getJ(url) { const r = await fetch(url); if (!r.ok) throw new Error('MLB feed answered ' + r.status); return r.json(); }
function wxFrom(w) {
  if (!w || (!w.temp && !w.wind && !w.condition)) return { wxPosted: 'no' };
  const cond = String(w.condition || ''); if (/dome|roof closed/i.test(cond)) return { wxPosted: 'yes', wind: '1', temp: '1', wxText: cond };
  const m = String(w.wind || '').match(/(\d+)\s*mph,?\s*(.*)/i); const mph = m ? +m[1] : 0, dir = m ? m[2] : '';
  let wind = '1'; if (/^out/i.test(dir)) wind = mph >= 15 ? '1.15' : mph >= 8 ? '1.07' : '1'; else if (/^in/i.test(dir)) wind = mph >= 15 ? '0.85' : mph >= 8 ? '0.93' : '1';
  const t = +w.temp; const temp = t >= 85 ? '1.05' : t && t < 55 ? '0.93' : '1';
  return { wxPosted: 'yes', wind, temp, wxText: `${w.temp || '?'}°F, ${w.wind || 'wind n/a'}${cond ? ', ' + cond : ''}` };
}
const splitOf = (stats, type, group) => ((stats || []).find(s => s.type && s.type.displayName === type && s.group && s.group.displayName === group) || {}).splits || [];

  <div><label for="ph">${isB ? 'Bats' : 'Throws'}</label><select id="ph" name="hand">${(isB ? ['R', 'L', 'S'] : ['R', 'L']).map(x => `<option ${p.hand === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
  <h3>Season totals</h3><div class="row tight">${(isB ? BF_FIELDS : PF_FIELDS).map(f => fld('s_', s, f)).join('')}</div>`;
  if (!isB) h += `<details ${p.split && (num((p.split.vsL || {}).BF) || num((p.split.vsR || {}).BF)) ? 'open' : ''}><summary>Platoon splits (optional)</summary><p class="sub">Batters faced and results vs each hand. Small splits are pulled toward his overall line automatically.</p><h3>vs left-handed batters</h3><div class="row tight">${SPLIT_FIELDS.map(f => fld('L_', (p.split || {}).vsL, f)).join('')}</div><h3>vs right-handed batters</h3><div class="row tight">${SPLIT_FIELDS.map(f => fld('R_', (p.split || {}).vsR, f)).join('')}</div></details>`;
  if (p.log && p.log.length) h += `<details><summary>Game log (${p.log.length})</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Opp</th>${(isB ? BLOG : PLOG).map(([, l]) => `<th>${l}</th>`).join('')}<th></th></tr></thead><tbody>${p.log.slice().reverse().map((g, i) => `<tr><td class="l">${esc(g.date)}</td><td>${esc(g.opp || '')}</td>${(isB ? BLOG : PLOG).map(([k]) => `<td>${esc(g[k] != null ? g[k] : '')}</td>`).join('')}<td><button type="button" class="small ghost" data-act="delLog" data-id="${p.id}" data-i="${p.log.length - 1 - i}" aria-label="Delete game">✕</button></td></tr>`).join('')}</tbody></table></div></details>`;
  h += `<div class="flex" style="margin-top:14px"><button class="primary" type="button" data-act="savePlayer">Save ${p.type}</button><button type="button" class="ghost" data-act="close">Cancel</button>${p.id ? `<button type="button" class="ghost neg" data-act="delPlayer" data-id="${p.id}">Delete</button>` : ''}</div></form>`;
  return h;
}
function logForm(pid) {
  const opts = Object.values(S.players).sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${pid === p.id ? 'selected' : ''}>${esc(p.name)} (${p.type})</option>`).join('');
  const p = P(pid) || Object.values(S.players)[0]; if (!p) return `<p class="empty">Add a player first.</p><button data-act="close">Close</button>`;
  const F = p.type === 'batter' ? BLOG : PLOG;
  return `<h2 style="margin-top:0">Log a game</h2><form id="logForm"><div class="row"><div><label for="lp">Player</label><select id="lp" name="pid" data-chg="logPlayer">${opts}</select></div><div><label for="ld">Date</label><input id="ld" type="date" name="date" value="${DATE}"></div><div><label for="lo">Opponent / pitcher</label><input id="lo" name="opp"></div></div>
  <div class="row tight">${F.map(([k, l]) => `<div><label for="lg${k}">${l}</label><input id="lg${k}" name="${k}" inputmode="decimal"></div>`).join('')}</div>
  <label class="flex" style="color:var(--ink);font-size:.95rem"><input type="checkbox" name="addSeason" checked style="width:auto"> Also add to season totals</label>
  <p class="sub">Leave it checked if your season totals are older than this game. Uncheck if you just imported stats that already include it.</p>
  <div class="flex" style="margin-top:12px"><button class="primary" type="button" data-act="saveLog">Save game</button><button type="button" class="ghost" data-act="close">Close</button></div></form>`;
}

// CSV
function parseCSV(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === '\t') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const ALIAS = { name: 'name', player: 'name', playername: 'name', team: 'team', tm: 'team', bats: 'hand', throws: 'hand', hand: 'hand', b: 'hand', t: 'hand', pa: 'PA', ab: 'AB', h: 'H', '2b': 'D', '3b': 'T', hr: 'HR', bb: 'BB', so: 'SO', k: 'SO', r: 'R', rbi: 'RBI', g: 'G', gs: 'GS', ip: 'IP', tbf: 'BF', bf: 'BF', er: 'ER' };
function upsert(type, rec) {
  if (!rec.name) return 0; const name = String(rec.name).replace(/[*#+]+$/, '').trim(); const id = slug(type + '-' + name);
  const p = S.players[id] || { id, type, name, season: {}, log: [] };
  p.name = name; if (rec.team) p.team = String(rec.team); if (rec.hand) p.hand = String(rec.hand).toUpperCase().slice(0, 1).replace('B', 'S');
  const keys = type === 'batter' ? BF_FIELDS.map(f => f[0]) : PF_FIELDS.map(f => f[0]);
  keys.forEach(k => { if (rec[k] !== undefined && rec[k] !== '' && rec[k] !== null) p.season[k] = k === 'IP' ? String(rec[k]) : num(rec[k]); });
  if (type === 'pitcher' && !p.season.BF && p.season.IP) p.season.BF = Math.round(ipToNum(p.season.IP) * 3 + num(p.season.H) + num(p.season.BB));
  if (type === 'batter' && !p.season.PA && rec.AB) p.season.PA = num(rec.AB) + num(rec.BB);
  S.players[id] = p; persist('players', id); return 1;
}

// ===== Actions =====
const ACT = {
  closeBg: (d, el, e) => { if (e.target === el) closeSheet(); },
  close: () => closeSheet(),
  date: (d, el) => { DATE = el.value || today(); render(); },
  newSide: () => { if (!players('pitcher').length) { toast('Add a pitcher in Data first.'); return; } openSheet(sideForm({ lineup: [] })); },
  editSide: d => openSheet(sideForm(slate(DATE).sides.find(s => s.id === d.id))),
  delSide: d => { const sl = slate(DATE); sl.sides = sl.sides.filter(s => s.id !== d.id); sl.props = sl.props.filter(p => p.sideId !== d.id); persist('slates', DATE); render(); },
  saveSide: d => {
    const fd = Object.fromEntries(new FormData($('#sideForm'))); const sl = slate(DATE);
    const ex = sl.sides.find(s => s.id === d.id) || {}; const g = Object.assign({}, ex, { id: d.id || uid(), penSet: true, runsSet: true, label: fd.label, pitcher: fd.pitcher, home: fd.home, parkHit: fd.parkHit, parkHR: fd.parkHR, pen: fd.pen, teamRuns: fd.teamRuns, ip: fd.ip, oppWRC: fd.oppWRC, wxPosted: fd.wxPosted, wind: fd.wind, temp: fd.temp, lineup: Array.from({ length: 9 }, (_, i) => fd['b' + i] || '') });
    const i = sl.sides.findIndex(s => s.id === g.id); if (i >= 0) sl.sides[i] = g; else sl.sides.push(g);
    persist('slates', DATE); closeSheet(); render();
  },
  load: () => loadSlate(DATE),
  toggle: d => { OPEN.has(d.id) ? OPEN.delete(d.id) : OPEN.add(d.id); render(); },
  scope: () => { scopeAll = !scopeAll; render(); },
  priceB: d => priceSheet(d, 'B'), priceP: d => priceSheet(d, 'P'),
  pmChange: () => { const f = $('#priceForm'); const M = f.dataset.kind === 'P' ? PMKT : BMKT; $('#pl').innerHTML = M[$('#pm').value][1].map(x => `<option>${x}</option>`).join(''); updatePriceOut(); },
  saveProp: () => { const pr = formProp(); if (!pr.odds) { toast('Enter the odds for your side.'); return; } slate(DATE).props.push(pr); persist('slates', DATE); closeSheet(); render(); toast('Added to board'); },
  delProp: d => { const sl = slate(DATE); sl.props = sl.props.filter(p => p.id !== d.id); persist('slates', DATE); render(); },
  takePick: d => {
    const sl = slate(DATE); const pr = sl.props.find(p => p.id === d.id); const ev = propEval(pr, sl); if (!ev) return;
    const id = uid(); const pl = P(pr.player);
    S.picks[id] = { id, t: String(Date.now()), date: DATE, name: pl.name, kind: pr.kind, market: pr.market, mlabel: (pr.kind === 'P' ? PMKT : BMKT)[pr.market][0], line: pr.line, side: pr.side, odds: pr.odds, modelP: ev.mp, fair: ev.pc ? ev.pc.fair : null, edge: ev.pc ? ev.pc.edge : null, stake: 1 };
    persist('picks', id); toast('Logged to Record');
  },
};
Object.assign(ACT, {
  close: () => closeSheet(),
  result: (d, el) => { const p = S.picks[d.id]; p.result = el.value; persist('picks', d.id); render(); },
  delPick: d => { delete S.picks[d.id]; persist('picks', d.id); render(); },
  pSort: d => { pSort = d.k; render(); }, bSort: d => { bSort = d.k; render(); },
  editPlayer: d => openSheet(playerForm(d.id ? P(d.id) : { type: d.type })),
  savePlayer: () => {
    const f = $('#playerForm'); const fd = Object.fromEntries(new FormData(f)); const type = f.dataset.type;
    if (!fd.name.trim()) { toast('Name is required.'); return; }
    const id = f.dataset.id || slug(type + '-' + fd.name); const p = S.players[id] || { id, type, log: [] };
    p.name = fd.name.trim(); p.team = fd.team.trim(); p.hand = fd.hand; p.season = {};
    (type === 'batter' ? BF_FIELDS : PF_FIELDS).forEach(([k]) => { const v = fd['s_' + k]; if (v !== '') p.season[k] = k === 'IP' ? v : num(v); });
    if (type === 'pitcher') { p.split = { vsL: {}, vsR: {} }; SPLIT_FIELDS.forEach(([k]) => { if (fd['L_' + k]) p.split.vsL[k] = num(fd['L_' + k]); if (fd['R_' + k]) p.split.vsR[k] = num(fd['R_' + k]); }); }
    S.players[id] = p; persist('players', id); simCache.clear(); closeSheet(); render(); toast('Saved');
  },
  delPlayer: d => { if (!confirm('Delete this player and his game log?')) return; delete S.players[d.id]; persist('players', d.id); closeSheet(); render(); },
  delLog: d => { const p = P(d.id); p.log.splice(+d.i, 1); persist('players', d.id); simCache.clear(); openSheet(playerForm(p)); },
  logGame: () => openSheet(logForm()),
  logPlayer: (d, el) => openSheet(logForm(el.value)),
  saveLog: () => {
    const f = $('#logForm'); const fd = Object.fromEntries(new FormData(f)); const p = P(fd.pid); if (!p) return;
    const F = p.type === 'batter' ? BLOG : PLOG; const g = { date: fd.date, opp: fd.opp };
    F.forEach(([k]) => g[k] = k === 'IP' ? (fd[k] || '0') : num(fd[k]));
    p.log = (p.log || []).concat(g).sort((a, b) => a.date.localeCompare(b.date)).slice(-60);
    if (fd.addSeason) { p.season = p.season || {}; F.forEach(([k]) => { if (k === 'IP') { const t = ipToNum(p.season.IP) + ipToNum(g.IP); const w = Math.floor(t + 1e-6); const fr = Math.round((t - w) * 3); p.season.IP = w + '.' + fr; } else p.season[k] = num(p.season[k]) + num(g[k]); });
      if (p.type === 'batter') { p.season.G = num(p.season.G) + 1; if (p.season.HG !== undefined) p.season.HG = num(p.season.HG) + (g.H > 0 ? 1 : 0); } else p.season.GS = num(p.season.GS) + 1; }
    persist('players', p.id); simCache.clear(); toast('Game saved'); openSheet(logForm(p.id));
  },
  importCsv: () => {
    const rows = parseCSV($('#impText').value); if (rows.length < 2) { toast('Paste a header row and at least one player.'); return; }
    const hdr = rows[0].map(x => ALIAS[x.trim().toLowerCase().replace(/[^a-z0-9]/g, '')] || null); const type = $('#impType').value;
    if (!hdr.includes('name')) { toast('No Name column found in the header.'); return; }
    let n = 0; rows.slice(1).forEach(r => { const rec = {}; hdr.forEach((k, i) => { if (k && r[i] != null) rec[k] = r[i].trim(); }); n += upsert(type, rec); });
    simCache.clear(); render(); toast(`Imported ${n} ${type}${n === 1 ? '' : 's'}`);
  },
  smartPaste: async (d, el) => {
    const text = $('#impText').value.trim(); const type = $('#impType').value; if (!text) { toast('Paste some text first.'); return; }
    el.disabled = true; el.textContent = 'Reading…';
    try {
      const fields = type === 'batter' ? 'name, team, hand (R/L/S), PA, H, D (doubles), T (triples), HR, BB, SO, R, RBI, G' : 'name, team, hand (R/L), GS, IP (as text like "152.1"), BF (batters faced), H, HR, BB, SO, ER';
      const out = await SAMPLE.json(`Extract season baseball stats for ${type}s from the text below. Return only JSON of the form {"rows":[{...}]} with keys: ${fields}. Use numbers. Omit any key not present in the text; never estimate or invent values. One object per player.\n\nTEXT:\n${text.slice(0, 20000)}`, { modelTier: 'quick' });
      const rows = (out && out.rows) || []; let n = 0; rows.forEach(r => n += upsert(type, r)); simCache.clear(); render(); toast(`Read ${n} ${type}${n === 1 ? '' : 's'}. Check the numbers.`);
    } catch (e) { toast(e && e.code === 'not_granted' ? 'Claude access was not allowed.' : 'Could not read that paste. Try CSV.'); el.disabled = false; el.textContent = 'Read messy paste with Claude'; }
  },
  restore: () => { try { const j = JSON.parse($('#backup').value); if (!j.players) throw 0; S.players = j.players; S.picks = j.picks || {}; S.slates = j.slates || {}; for (const c of ['players', 'picks', 'slates']) for (const id of Object.keys(S[c])) persist(c, id); simCache.clear(); render(); toast('Restored'); } catch (e) { toast('That text is not a valid backup.'); } },
});
ACT.closeOdds = (d, el) => { const p = S.picks[d.id]; p.close = el.value.trim(); persist('picks', d.id); render(); };
boot();
</script>
