<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchLab Price Desk</title>
</head>
<body>
<p>Loading LaunchLab…</p>
<script>
(function () {
  function boot(html) {
    var inject = '<script src="book-import.js"><\/script><script src="history-import.js"><\/script>';
    if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, inject + '</body>');
    else html += inject;
    document.open();
    document.write(html);
    document.close();
  }
  fetch('Index.html', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(boot)
    .catch(function () {
      document.body.innerHTML = '<p>Desk failed to load. Open <a href="Index.html">Index.html</a> then add the Import scripts.</p>';
    });
})();
</script>
</body>
</html>
